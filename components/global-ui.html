<div
  class="loading-overlay"
  id="loadingOverlay"
  hidden
  role="status"
  aria-live="polite"
>
  <div class="loader"></div>
  <strong id="loadingTitle">Loading quiz</strong>
  <p id="loadingMessage">Fetching questions from the quiz API…</p>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <section
    class="info-modal"
    id="infoModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >
    <button
      class="icon-button modal-close"
      id="modalCloseButton"
      type="button"
      aria-label="Close dialog"
    >
      ×
    </button>
    <div id="modalContent"></div>
  </section>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
