<section
  class="screen review-screen"
  id="reviewScreen"
  data-screen="review"
  aria-labelledby="reviewTitle"
  hidden
>
  <div class="review-shell">
    <div class="review-header">
      <button
        class="back-button dark-back"
        id="reviewBackButton"
        type="button"
        aria-label="Back to result"
      >
        ←
      </button>
      <div>
        <p class="section-kicker">Learn from every clue</p>
        <h1 id="reviewTitle">Let’s read the explanations</h1>
        <p>
          AI detection is not perfect. These explanations highlight useful
          clues, not absolute rules.
        </p>
      </div>
    </div>

    <div class="review-layout">
      <div
        class="review-list"
        id="reviewList"
        aria-label="Question explanations"
      ></div>
      <aside class="review-preview" id="reviewPreview" aria-live="polite">
        <div class="empty-preview">
          <span aria-hidden="true">⌁</span>
          <p>Select a question to review its content and explanation.</p>
        </div>
      </aside>
    </div>

    <div class="review-actions">
      <button class="secondary-button" type="button" data-nav="levels">
        Choose another level
      </button>
      <button class="primary-button" type="button" data-nav="home">
        Finish
      </button>
    </div>
  </div>
</section>
